name: Deploy Pages

# Publishes site/ (index.html, css, js, data) to GitHub Pages. Runs on pushes that touch site/, on demand,
# and is called by the capture workflow after its data commit (pushes made with GITHUB_TOKEN don't trigger workflows).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # the newest commit, including a data commit made earlier in the calling run
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/index.html site/css site/js site/data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
