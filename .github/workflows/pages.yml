name: Deploy Pages

# Publishes site/ (index.html, css, js, data) to GitHub Pages. Runs on pushes that touch site/, on demand,
# and is called by the capture workflow after its data commit (pushes made with GITHUB_TOKEN don't trigger workflows).
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # the newest commit, including a data commit made earlier in the calling run
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/index.html site/css site/js site/data _site/
          # Per-browser pages: every site/<name>/index.html (firefox/, safari/, ...) becomes /<name>/
          for d in site/*/; do if [ -f "$d/index.html" ]; then cp -r "$d" _site/; fi; done
          touch _site/.nojekyll
          # Free JSON feed: stable /api/ URLs, copied from the same data the page reads
          mkdir -p _site/api
          cp site/data/latest.json site/data/libraries.json _site/api/
          [ -f site/data/platforms.json ] && cp site/data/platforms.json _site/api/ || true
          [ -f site/data/history/index.json ] && cp site/data/history/index.json _site/api/history.json || true
          [ -f site/data/firefox.json ] && cp site/data/firefox.json _site/api/firefox.json || true
          # README badges (shields.io endpoint JSON), one per leaderboard row, built from the libraries.json being published
          python3 leaderboard/badges.py site/data/libraries.json _site/api/badges
          if [ -f site/data/firefox_libraries.json ]; then
            python3 leaderboard/badges.py site/data/firefox_libraries.json _site/api/badges/firefox "Firefox match"
            cp site/data/firefox_libraries.json _site/api/firefox_libraries.json
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
